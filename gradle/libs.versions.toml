[versions]
# Resolved from Maven Central / Google Maven on 2026-07-31. See ARCHITECTURE.md §14.
# KSP 2.x is versioned independently of Kotlin (its POM pins no Kotlin dependency),
# so the historical Kotlin<->KSP lockstep constraint no longer applies.
kotlin = "2.4.10"
ksp = "2.3.10"
# AGP 8.x relies on org.gradle.api.problems.internal.InternalProblems, removed in Gradle 9.6.0.
# AGP 8.13.2 therefore requires Gradle <= 9.5; the 9.x line is the one built for Gradle 9.
agp = "9.3.1"
coroutines = "1.11.0"
kotlinpoet = "2.3.0"
androidxTestRunner = "1.7.0"

# Android SDK levels. The library uses no Android APIs, so minSdk is essentially free.
androidCompileSdk = "36"
androidMinSdk = "24"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

# Plugin artifacts, needed on build-logic's compile classpath so the convention
# plugins can apply them by id without repeating versions.
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-ksp = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
