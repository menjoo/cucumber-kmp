# The Kotlin/Native compiler runs inside the Gradle and Kotlin daemons and is metaspace-hungry.
# With four Native targets in the matrix the defaults exhaust metaspace during concurrent linking,
# which surfaces as bare "Metaspace" task failures rather than anything self-explanatory.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g
kotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# The single source of truth for the published version. The release workflow rewrites this
# line; everything else reads it. Overridable per-invocation with -Pcucumberkmp.version=x.y.z.
cucumberkmp.version=0.2.1-SNAPSHOT

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
