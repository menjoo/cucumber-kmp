# The Kotlin/Native compiler runs inside the Gradle and Kotlin daemons and is metaspace-hungry.
# With four Native targets the JVM defaults are exhausted during concurrent linking, which surfaces
# as a bare "Metaspace" task failure that names nothing useful. Any Kotlin Multiplatform project
# with Native targets needs settings like these — that is why the example carries them.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g
kotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
