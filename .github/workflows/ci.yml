name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch supersedes an in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # Everything in ARCHITECTURE.md §7 Tier A that needs no browser and no device, plus the
  # compile-and-link check for iosArm64 (Tier B). Runs on macOS because the Apple targets require
  # Xcode — a Linux runner could not build them at all.
  build:
    name: Tier A matrix (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Set up explicitly rather than relying on the image: the Android SDK's presence on macOS
      # arm64 runners is not something to bet the build on, and this also sets ANDROID_HOME, which
      # AGP needs since local.properties is not committed.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Kotlin/Native compiler and its prebuilt platform libraries are a large download, keyed
      # by Kotlin version, so this changes only when the version catalog does.
      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Build and test
        run: ./gradlew build --stacktrace

      # `build` has no test task for a device target, so this is what proves the library still
      # compiles and links for a real iPhone. See ARCHITECTURE.md §7 Tier B.
      - name: Link-check iosArm64 (device target)
        run: ./gradlew linkDebugTestIosArm64 --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-tier-a
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  # Consumes the published artifacts from a standalone build, which is the only way to check that
  # the Gradle plugin registers its generated sources with every target's test source set. The
  # plugin's own tests skip that deliberately — see its functional test.
  example:
    name: examples/calculator (published artifacts)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # The default mode for anyone working locally or in an IDE, so a break here breaks everyone's
      # inner loop. JVM only — it exists to catch substitution breaking, not to re-run the matrix.
      - name: Composite mode (library substituted from source)
        run: ./gradlew -p examples/calculator jvmTest --stacktrace

      - name: Publish to mavenLocal
        run: ./gradlew publishToMavenLocal --stacktrace

      # The real verification: real artifacts, so packaging and source-set wiring are exercised
      # rather than substituted away.
      - name: Published mode (full matrix)
        run: >-
          ./gradlew -p examples/calculator build linkDebugTestIosArm64
          -Pcucumberkmp.composite=false --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-example
          path: examples/calculator/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore

  # Kept separate so a Karma or browser-startup flake cannot block the main gate, while still
  # running on every pull request.
  browser:
    name: Browser tests (Chrome)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JS and Wasm browser tests
        run: >-
          ./gradlew -Pcucumberkmp.browserTests
          :cucumber-kmp-core:jsBrowserTest
          :cucumber-kmp-core:wasmJsBrowserTest
          --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-browser
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore
