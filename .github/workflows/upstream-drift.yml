name: Upstream drift

# This whole project is a port pinned to upstream Cucumber's own test data (ARCHITECTURE.md §2).
# That pinning is only as good as our knowledge of when upstream changes, so this regenerates every
# corpus from upstream's main branch and reports any difference.
#
# Deliberately NOT part of CI: upstream changing is news, not a broken pull request. It runs on a
# schedule and on demand, and a failure here means "go look", not "someone broke something".

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Reads the repository, downloads upstream test data, and reports a diff as an artifact. It never
# commits, so it needs nothing beyond read.
permissions:
  contents: read

jobs:
  check:
    name: Regenerate corpora and diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Regenerate the Gherkin dialect table
        run: python3 tools/update-gherkin-dialects.py --download

      - name: Regenerate the Gherkin parser and pickle corpus
        run: python3 tools/update-gherkin-corpus.py

      - name: Regenerate the Cucumber Expressions corpus
        run: python3 tools/update-expression-corpus.py

      - name: Regenerate the tag expression corpus
        run: python3 tools/update-tag-expression-corpus.py

      - name: Report drift
        id: drift
        run: |
          if git diff --quiet; then
            echo "No drift: every corpus matches upstream main."
            exit 0
          fi
          echo "::warning::Upstream Cucumber test data has changed. Review the diff artifact."
          git --no-pager diff --stat
          git --no-pager diff > upstream-drift.patch
          exit 1

      - name: Upload the diff
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-drift-patch
          path: upstream-drift.patch
          retention-days: 30
          if-no-files-found: ignore
