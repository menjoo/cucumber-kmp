name: Release

# Manual only. Nothing is published by merging to main — a merge cannot know whether it is a patch
# or a major, so deciding that is an explicit act. See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading v (for example 1.0.0)'
        required: true
        type: string
      nextVersion:
        description: 'Next development version, without -SNAPSHOT (default: bump the patch)'
        required: false
        type: string

concurrency:
  # Two releases racing would fight over the version in gradle.properties.
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to check the version has not already been released.
          fetch-depth: 0

      - name: Validate the requested version
        run: |
          version='${{ inputs.version }}'
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a semantic version. Do not include a leading 'v'."
            exit 1
          fi
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists. Published versions are immutable."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Set the version before building so every artifact, POM and test runs against the exact
      # version being released rather than the snapshot.
      - name: Set the release version
        run: |
          ./.github/scripts/set-version.sh '${{ inputs.version }}'
          grep '^cucumberkmp.version=' gradle.properties

      - name: Verify
        run: ./gradlew build --stacktrace

      # Builds the example against the very artifacts about to be published, rather than against
      # substituted projects. This is the last chance to catch a packaging or source-set problem
      # before the version becomes immutable.
      - name: Verify the artifacts a consumer would get
        run: |
          ./gradlew publishToMavenLocal --stacktrace
          ./gradlew -p examples/calculator build -Pcucumberkmp.composite=false --stacktrace

      # Commit and tag BEFORE publishing. Publishing is the irreversible half: an artifact with no
      # tag cannot be undone, whereas a tag with no artifact is deleted and retried.
      - name: Commit and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle.properties
          git commit -m 'Release ${{ inputs.version }}'
          git tag -a 'v${{ inputs.version }}' -m 'Release ${{ inputs.version }}'
          git push origin HEAD:main
          git push origin 'v${{ inputs.version }}'

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set these repository secrets to publish signed artifacts. Signing is
          # required by Maven Central and ignored by GitHub Packages.
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --stacktrace

      - name: Open the next development version
        run: |
          next='${{ inputs.nextVersion }}'
          if [[ -z "$next" ]]; then
            next=$(./.github/scripts/next-patch.sh '${{ inputs.version }}')
          fi
          ./.github/scripts/set-version.sh "$next-SNAPSHOT"
          git add gradle.properties
          git commit -m "Open $next-SNAPSHOT for development"
          git push origin HEAD:main
          echo "::notice::Released ${{ inputs.version }}; main is now on $next-SNAPSHOT"

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-release
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 30
          if-no-files-found: ignore
