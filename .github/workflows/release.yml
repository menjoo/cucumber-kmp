name: Release

# Puts the version in the run's title, so the Actions list reads "Release 0.1.2" rather than a
# column of identical "Release" entries you have to open to tell apart. The job-level `name:`
# below does not do this — it only labels the job inside a run.
run-name: Release ${{ inputs.version }}

# Manual only, and it never writes to main.
#
# `main` is a protected branch requiring pull requests, and CI writing to it would defeat that.
# So the version bump happens in an ordinary pull request and this workflow only reads the result,
# publishes it, and pushes a tag — tags are not covered by the branch ruleset, so no bypass actor
# and no long-lived token are needed.
#
# See RELEASING.md for the full sequence.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release. Must already match gradle.properties on main.'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # Enough to push a tag. Notably not enough to push to main, which the ruleset blocks anyway.
  contents: write
  packages: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: macos-latest
    timeout-minutes: 90
    # Gates the only job holding the signing key and the Central Portal credentials behind a
    # manual approval, and is where those secrets should live rather than at repository scope.
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Tags are needed to check this version has not already been released.
          fetch-depth: 0

      # The input is a confirmation, not the source of truth. Requiring it to match the committed
      # version makes it impossible to release "whatever happened to be on main" by accident.
      #
      # It reaches bash through the environment, never through a ${{ }} inside the run block: the
      # template engine substitutes before bash parses, so an input containing a quote would be
      # shell source — and would run *before* any check below could reject it. Same everywhere
      # inputs.version is used later.
      - name: Check the version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          committed=$(.github/scripts/get-version.sh)
          requested="$REQUESTED"

          if [[ "$committed" != "$requested" ]]; then
            echo "::error::You asked for $requested but main is on $committed."
            echo "::error::Merge a pull request setting cucumberkmp.version=$requested first."
            exit 1
          fi
          if [[ "$committed" == *-SNAPSHOT ]]; then
            echo "::error::$committed is a development version. Release a fixed version instead."
            exit 1
          fi
          if [[ ! "$committed" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$committed' is not a semantic version."
            exit 1
          fi
          if git rev-parse "v$committed" >/dev/null 2>&1; then
            echo "::error::Tag v$committed already exists. Published versions are immutable."
            exit 1
          fi

          # Refuse to go backwards. Nothing above catches it: 0.0.9 after 0.1.1 is valid semver,
          # is not a snapshot, and has no tag, so every other check here passes it happily — and
          # publishing is the irreversible half.
          #
          # Only the numeric core is compared, and only for "not older" rather than "strictly
          # newer". Both are deliberate. Full semver precedence puts 1.0.0-rc1 *before* 1.0.0,
          # which `sort -V` gets wrong and which is more machinery than this is worth; and
          # comparing cores loosely is what lets 1.0.0 follow 1.0.0-rc1, since an exact repeat is
          # already refused by the tag check above.
          #
          # Field-wise numeric sort rather than `sort -V`: portable across GNU and BSD.
          core () { printf '%s\n' "${1%%-*}"; }
          highest () { sort -t. -k1,1n -k2,2n -k3,3n | tail -1; }

          released=$(git tag --list 'v[0-9]*' | sed 's/^v//' | while read -r tag; do core "$tag"; done | highest)
          if [[ -n "$released" ]]; then
            newest=$(printf '%s\n%s\n' "$released" "$(core "$committed")" | highest)
            if [[ "$newest" != "$(core "$committed")" ]]; then
              echo "::error::$committed is older than the last release, $released."
              echo "::error::Versions only go forwards — Central deployments cannot be replaced."
              exit 1
            fi
          fi

          echo "Releasing $committed from $(git rev-parse --short HEAD)"

      - name: Set up JDK 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Cache Konan
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Checked before anything is built so a missing secret costs seconds, not a full matrix.
      - name: Check Maven Central configuration
        id: central
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [[ -z "$CENTRAL_PORTAL_USERNAME" ]]; then
            echo "::notice::CENTRAL_PORTAL_USERNAME is not set — publishing to GitHub Packages only."
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::Maven Central requires signed artifacts, but SIGNING_KEY is not set."
            exit 1
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Verify
        run: ./gradlew build --stacktrace

      # Builds the example against the very artifacts about to be published, rather than against
      # substituted projects. Signing is switched on so the local publication is byte-for-byte what
      # the registries will receive, which is what makes the next step meaningful.
      - name: Verify the artifacts a consumer would get
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishToMavenLocal --stacktrace
          ./gradlew -p examples/calculator build -Pcucumberkmp.composite=false --stacktrace

      # Central validates the whole deployment and rejects it as a unit — but only after the
      # release has been tagged and pushed. Running the same checks here moves that failure into
      # the reversible half. 0.1.0 was lost to precisely this.
      - name: Verify the deployment would pass Maven Central
        if: ${{ steps.central.outputs.configured == 'true' }}
        env:
          VERSION: ${{ inputs.version }}
        run: .github/scripts/verify-publishable.py --version "$VERSION"

      # Tag BEFORE publishing. Publishing is the irreversible half: an artifact with no tag cannot
      # be undone, whereas a tag with no artifact is deleted and retried.
      - name: Tag the release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "v$VERSION"

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set these repository secrets to publish signed artifacts. Signing is
          # required by Maven Central and ignored by GitHub Packages.
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --stacktrace

      # Uploads every module's publications as one deployment. With the default USER_MANAGED type
      # it is staged in the Portal for a human to release, not published outright.
      - name: Publish to Maven Central
        if: ${{ steps.central.outputs.configured == 'true' }}
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal --stacktrace

      # Last, so a release only appears once the artifacts behind it exist. --verify-tag refuses if
      # the tag somehow is not on the remote, which would otherwise create a release pointing at
      # nothing.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          CENTRAL_CONFIGURED: ${{ steps.central.outputs.configured }}
        run: |
          notes=$(mktemp)
          {
            echo '## Install'
            echo
            echo '```kotlin'
            echo "implementation(\"io.github.menjoo.cucumberkmp:cucumber-kmp-core:$VERSION\")"
            echo '```'
            echo
            if [[ "$CENTRAL_CONFIGURED" == 'true' ]]; then
              echo "Published to [Maven Central](https://central.sonatype.com/artifact/io.github.menjoo.cucumberkmp/cucumber-kmp-core/$VERSION) and GitHub Packages."
              echo
              echo 'Central deployments are staged for review, so this may take a few minutes to'
              echo 'become resolvable after the deployment is released in the Portal.'
            else
              echo 'Published to GitHub Packages.'
            fi
          } > "$notes"

          # --generate-notes appends the auto-generated "What's Changed" section after this body.
          gh release create "v$VERSION" \
            --title "$VERSION" \
            --notes-file "$notes" \
            --generate-notes \
            --verify-tag

      - name: Summarise
        env:
          VERSION: ${{ inputs.version }}
          CENTRAL_CONFIGURED: ${{ steps.central.outputs.configured }}
        run: |
          next=$(.github/scripts/next-patch.sh "$VERSION")
          {
            echo "### Released $VERSION"
            echo
            echo "Tagged \`v$VERSION\`, published to GitHub Packages, and created"
            echo "[the GitHub release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION)."
            if [[ "$CENTRAL_CONFIGURED" == 'true' ]]; then
              echo
              echo "Uploaded to Maven Central as a **staged deployment**. It is not public yet —"
              echo "review and release it at <https://central.sonatype.com/publishing/deployments>."
            fi
            echo
            echo "**Next:** open a pull request setting \`cucumberkmp.version=$next-SNAPSHOT\`:"
            echo
            echo '```bash'
            echo ".github/scripts/set-version.sh $next-SNAPSHOT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-release
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 30
          if-no-files-found: ignore
